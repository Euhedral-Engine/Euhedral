name: CUDA native products

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "mise.toml"
      - "rust/**"
      - ".github/workflows/native-package.yaml"
  pull_request:
    paths:
      - "native/**"
      - "mise.toml"
      - "rust/**"
      - ".github/workflows/native-package.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/native/.zig-global-cache
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v5.0.0
        with:
          install: true
          cache: true
      - name: Cache Zig
        uses: actions/cache@v6.1.0
        with:
          path: |
            native/.zig-cache
            native/.zig-global-cache
          key: ${{ runner.os }}-zig-${{ hashFiles('mise.toml', 'native/build.zig', 'native/native-products.json') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.12"
      - name: Build and verify both CUDA products
        working-directory: rust
        run: |
          mise exec -- cargo xtask native
          mise exec -- cargo xtask native-verify
      - name: Check ELF/PE targets, imports, and installed CUDA sources
        run: python -m unittest discover -s native/tests -v
      - name: Bundle the Rust server (linux-x64)
        if: runner.os == 'Linux'
        working-directory: rust
        run: mise exec -- cargo xtask bundle --product linux-x64
      - uses: actions/upload-artifact@v7.0.1
        if: runner.os == 'Linux'
        with:
          name: rust-server-linux-x64
          if-no-files-found: error
          retention-days: 2
          path: build/bundle/euhedral-server-linux-x64.tar.gz
