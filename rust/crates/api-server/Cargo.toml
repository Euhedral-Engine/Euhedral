[package]
name = "euhedral-inference-api-server"
version = "0.1.0"
description = "The HTTP server of the API: routing, the routes that need no generation, the limits and the backend the generating routes use."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `ScriptedBackend`, a backend that follows a script, for the tests of this crate and of the crates built on it.
test-support = []

[dependencies]
euhedral-core.workspace = true
euhedral-data-structures.workspace = true
euhedral-graph.workspace = true
euhedral-io.workspace = true
euhedral-net.workspace = true
euhedral-inference-api-protocol = { path = "../api-protocol" }
euhedral-inference-engine = { path = "../engine" }
euhedral-inference-settings = { path = "../settings" }
euhedral-inference-tokenizer = { path = "../tokenizer" }
log.workspace = true
sha2.workspace = true

[dev-dependencies]
euhedral-inference-api-server = { path = ".", features = ["test-support"] }
euhedral-hardware-utils.workspace = true

[lints]
workspace = true
