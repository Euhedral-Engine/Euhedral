[tools]
zig = "0.16.0"
rust = { version = "1.99.1", targets = "x86_64-unknown-linux-gnu,x86_64-pc-windows-gnu", profile = "default" }
"cargo:cargo-zigbuild" = "0.23.4"

[tasks."rust-layers"]
description = "Check the Rust workspace's dependency layers and clippy.toml copies, proving the check fails on planted violations."
dir = "rust"
run = "scripts/check-layers.sh --self-test"

[tasks."rust-check"]
description = "Check Rust layers, formatting and lints, then run the CPU Rust tests."
depends = ["rust-layers"]
dir = "rust"
run = [
  "cargo fmt --all --check",
  "cargo clippy --workspace --all-targets -- -D warnings",
  "cargo test --workspace",
]

[tasks."rust-test"]
description = "Run the CPU Rust tests."
dir = "rust"
run = "cargo test --workspace"

[tasks."rust-native"]
description = "Build the Linux host CUDA product the Rust crates load."
dir = "rust"
run = "cargo xtask native --product linux-x64"

[tasks."rust-native-verify"]
description = "Check the built Linux host CUDA product."
dir = "rust"
run = "cargo xtask native-verify --product linux-x64"

[tasks."native-test"]
description = "Run native Python/CUDA tests (requires an available GPU)."
run = "python3 -m unittest discover -s native/tests -p 'test_*.py'"

[tasks."test-deploy"]
description = "Exercise cutover, rollback and cleanup-order tests without Docker writes."
tools = { uv = "0.13.2" }
run = "uv run --with PyYAML==6.0.3 python -m unittest discover -s scripts -p 'test_*.py'"

[tasks.deploy]
description = "Deploy from a YAML or .env file: build main, mount files, verify inference, and clean up."
tools = { uv = "0.13.2" }
usage = 'arg "<file>" help="Host YAML or Docker-format .env file"'
run = 'uv run scripts/deploy-main.py "${usage_file?}"'
