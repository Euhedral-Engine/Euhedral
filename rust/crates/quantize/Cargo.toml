[package]
name = "euhedral-inference-quantize"
version = "0.1.0"
description = "The quantization command line: parses the command and its flags and runs it on the quantization library."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "quantization"
path = "src/main.rs"

[dependencies]
euhedral-core.workspace = true
euhedral-graph.workspace = true
euhedral-inference-engine = { path = "../engine" }
euhedral-inference-quantization = { path = "../quantization" }
euhedral-inference-settings = { path = "../settings" }
euhedral-io.workspace = true

[dev-dependencies]
euhedral-inference-edrl = { path = "../edrl", features = ["test-util"] }
serde_json.workspace = true
tempfile.workspace = true

[lints]
workspace = true
