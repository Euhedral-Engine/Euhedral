[workspace]
members = ["crates/bench", "crates/cuda", "crates/edrl", "crates/engine", "crates/host-gemv", "crates/settings", "crates/test-support", "crates/tokenizer", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

# The RustEE crates join [workspace.dependencies] as git dependencies on https://github.com/Euhedral-Engine/RustEE.git,
# every one pinned to the same `rev`.
[workspace.dependencies]
crc32fast = "1.5"
euhedral-core = { git = "https://github.com/Euhedral-Engine/RustEE.git", rev = "8b0e85cf5187a8a0f8319077933554db24cda53d" }
euhedral-graph = { git = "https://github.com/Euhedral-Engine/RustEE.git", rev = "8b0e85cf5187a8a0f8319077933554db24cda53d", default-features = false }
euhedral-hardware-utils = { git = "https://github.com/Euhedral-Engine/RustEE.git", rev = "8b0e85cf5187a8a0f8319077933554db24cda53d" }
euhedral-hashing = { git = "https://github.com/Euhedral-Engine/RustEE.git", rev = "8b0e85cf5187a8a0f8319077933554db24cda53d" }
java-properties = "2"
libloading = "0.8"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml_ng = "0.10"
sha2 = "0.10"
tempfile = "3.27"
thiserror = "2"
tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"] }

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
absolute_paths = "warn"
dbg_macro = "warn"
expect_used = "warn"
print_stderr = "warn"
print_stdout = "warn"
todo = "warn"
undocumented_unsafe_blocks = "warn"
unwrap_used = "warn"
