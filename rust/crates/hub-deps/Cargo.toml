[package]
name = "euhedral-inference-hub-deps"
version = "0.1.0"
description = "Holds no code: lists the third-party crates that RustEE's build files name directly, so the one crate hub of the workspace exposes them and RustEE links the same copies as the workspace."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
libc = { version = "0.2", default-features = false }
log.workspace = true

[target.'cfg(unix)'.dependencies]
io-uring = { version = "0.7", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", default-features = false }

[lints]
workspace = true
