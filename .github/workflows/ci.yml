# The GitHub side of the Windows Bazel gate: the workflow the proxy dispatches from the Gitea pull request (the inputs only_os
# and proxy_id are the proxy's). It runs the Linux gate's test command on the Windows platform; the repository's own .bazelrc
# defines `--config=ci`.
name: ci
on:
  workflow_dispatch:
    inputs:
      only_os:
        type: choice
        options: [all, ubuntu-latest, windows-2025]
        default: all
      base_ref:
        type: string
        default: ""
      proxy_id:
        type: string
        default: ""
run-name: ${{ inputs.proxy_id && format('ci [{0}]', inputs.proxy_id) || github.ref_name }}
permissions:
  contents: read
jobs:
  bazel-windows:
    if: inputs.only_os == 'windows-2025'
    runs-on: windows-2025
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      # MSVC's link.exe, and rustc's link of the proc macros, open no path of 260 characters or more. Under the output base in
      # the runner's profile a doc test's runfiles path to the standard library's rlibs is about 300 long and a proc-macro
      # object (euhedral_crates__macro_rules_attribute-proc_macro) 288. A short output base, the platform's output directory
      # named `w` instead of `x64_windows` and `dbg` (debug info, the same code as fastbuild) instead of `fastbuild` bring the
      # longest doc test path to 256 and the proc-macro object to 243. user.bazelrc is the machine's layer.
      # The output base is on D:, the runner's data drive: runfiles are copies on Windows, and C: runs out of space.
      - name: Short output paths
        run: |
          {
            echo "startup --output_base=D:/b"
            echo "common --experimental_platform_in_output_dir"
            echo "common --experimental_override_platform_cpu_name=@euhedral_build//platforms:windows_x86_64=w"
            echo "common --compilation_mode=dbg"
          } > user.bazelrc

      - name: Bazel test on the Windows platform
        env:
          MSYS_NO_PATHCONV: "1" # Git Bash would rewrite the // in the labels as a path
        run: bazel test //... --config=ci --platforms=@euhedral_build//platforms:windows_x86_64
