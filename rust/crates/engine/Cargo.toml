[package]
name = "euhedral-inference-engine"
version = "0.1.0"
description = "The Qwen3.8 engine on RustEE: the runtime, the residency planner, the weight loader, the workspace and the sequence state."
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# `Executor::check_replay_for_tests`: the C library's check mode over a quantum's stages. Enabled for the crate's own
# tests by the dev-dependency on itself.
test-oracles = ["euhedral-inference-cuda/test-oracles"]

[dependencies]
euhedral-core.workspace = true
euhedral-data-structures.workspace = true
euhedral-graph = { workspace = true, features = ["async-io"] }
euhedral-hardware-utils.workspace = true
euhedral-hashing.workspace = true
euhedral-inference-cuda = { path = "../cuda" }
euhedral-inference-edrl = { path = "../edrl" }
euhedral-inference-settings = { path = "../settings" }
log.workspace = true
thiserror.workspace = true

[dev-dependencies]
euhedral-inference-engine = { path = ".", features = ["test-oracles"] }
euhedral-inference-cuda = { path = "../cuda", features = ["test-oracles"] }
euhedral-inference-tokenizer = { path = "../tokenizer" }
sha2.workspace = true
tempfile.workspace = true
test-support = { path = "../test-support" }

[lints]
workspace = true
