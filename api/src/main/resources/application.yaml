# Fixed internals; every deployer setting lives in the YAML file the server is started with (--config).
server:
  # Let in-flight completions finish before generation threads and the engine are stopped.
  shutdown: graceful

# Prometheus metrics at /metrics; no other management endpoint is exposed.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    tags:
      application: euhedral-inference

spring:
  lifecycle:
    timeout-per-shutdown-phase: 30s
  application:
    name: euhedral-inference-api
  main:
    banner-mode: off
