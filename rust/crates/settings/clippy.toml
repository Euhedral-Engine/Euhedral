# The no-thread, no-wait rules of this workspace: nothing here blocks or spins, and the threads belong to the lattice.
# Every library crate of the workspace (every crate except xtask and the binaries, whose main thread may block) has a
# clippy.toml that is byte-identical to this file; scripts/check-layers.sh checks the copies.
# A listed call is allowed only in a test fixture (peer threads, arrival races) or where a call has no non-blocking
# form (startup, shutdown, a test), under an `#[allow(clippy::disallowed_methods)]` that names the rule it excepts.
disallowed-methods = [
    { path = "std::thread::spawn", reason = "the lattice owns the threads" },
    { path = "std::thread::Builder::spawn", reason = "the lattice owns the threads" },
    { path = "std::thread::Builder::spawn_scoped", reason = "the lattice owns the threads" },
    { path = "std::thread::scope", reason = "the lattice owns the threads" },
    { path = "std::thread::sleep", reason = "nothing waits: submit, and continue on the completion" },
    { path = "std::thread::park", reason = "nothing waits" },
    { path = "std::thread::park_timeout", reason = "nothing waits" },
    { path = "std::thread::yield_now", reason = "nothing spins" },
    { path = "std::hint::spin_loop", reason = "nothing spins" },
    { path = "std::sync::mpsc::channel", reason = "no channels: frames are offered to a source" },
    { path = "std::sync::mpsc::sync_channel", reason = "no channels" },
    { path = "std::sync::Mutex::new", reason = "no locks: state is owned by a sink or a source and polled one frame at a time" },
    { path = "std::sync::RwLock::new", reason = "no locks: state is owned by a sink or a source and polled one frame at a time" },
    { path = "std::sync::Condvar::wait", reason = "nothing waits" },
    { path = "std::sync::Condvar::wait_while", reason = "nothing waits" },
    { path = "std::sync::Condvar::wait_timeout", reason = "nothing waits" },
    { path = "std::sync::Condvar::wait_timeout_while", reason = "nothing waits" },
    { path = "std::sync::Barrier::wait", reason = "nothing waits" },
    { path = "std::fs::read", reason = "blocking I/O: use AsyncIo" },
    { path = "std::fs::read_to_string", reason = "blocking I/O: use AsyncIo" },
    { path = "std::fs::write", reason = "blocking I/O: use AsyncIo" },
    { path = "std::fs::copy", reason = "blocking I/O: use AsyncIo" },
    { path = "std::fs::File::open", reason = "blocking I/O: use AsyncIo" },
    { path = "std::fs::File::create", reason = "blocking I/O: use AsyncIo" },
    { path = "std::fs::OpenOptions::open", reason = "blocking I/O: use AsyncIo" },
    { path = "std::fs::read_dir", reason = "blocking I/O: use AsyncIo" },
    { path = "std::fs::metadata", reason = "blocking I/O: use AsyncIo" },
    { path = "std::io::stdin", reason = "blocking I/O: a read from standard input waits" },
    { path = "std::net::TcpStream::connect", reason = "blocking I/O: use AsyncIo" },
    { path = "std::net::TcpStream::connect_timeout", reason = "blocking I/O: use AsyncIo" },
    { path = "std::net::TcpListener::accept", reason = "blocking I/O: use AsyncIo::accept" },
    { path = "std::process::Command::output", reason = "waits for a child process" },
    { path = "std::process::Child::wait", reason = "waits for a child process" },
    { path = "std::process::Child::wait_with_output", reason = "waits for a child process" },
    { path = "std::process::Command::status", reason = "waits for a child process" },
    { path = "std::thread::JoinHandle::join", reason = "nothing waits: the lattice owns the threads" },
    { path = "std::thread::ScopedJoinHandle::join", reason = "nothing waits: the lattice owns the threads" },
    # Waiting calls of the CUDA library, banned where the crate is linked (allow-invalid: absent elsewhere). The
    # safe wrappers that wait (startup, shutdown and tests) are banned for every other crate, and the generated
    # `EuhedralCuda` methods they call are banned inside the cuda crate, so the wrapper that waits carries the scoped
    # allow. A raw call through a generated fn-pointer field, `(api.euhedral_cuda_free)(p)`, is not seen by clippy and
    # needs the same allow by convention (see the cuda crate docs).
    { path = "euhedral_inference_cuda::CudaLibrary::synchronize", reason = "nothing waits on the device: poll the lane's completion word (startup, shutdown and tests only)", allow-invalid = true },
    { path = "euhedral_inference_cuda::CudaLane::synchronize", reason = "nothing waits on a stream: poll the lane's completion word (startup, shutdown and tests only)", allow-invalid = true },
    { path = "euhedral_inference_cuda::DeviceBuffer::copy_from_host", reason = "a synchronous copy waits for the device: queue ops::copy_upload_to_device on a lane", allow-invalid = true },
    { path = "euhedral_inference_cuda::DeviceBuffer::copy_to_host", reason = "a synchronous copy waits for the device: queue ops::copy_device_to_readback on a lane", allow-invalid = true },
    { path = "euhedral_inference_cuda::ops::copy_host_to_device", reason = "a synchronous copy waits for the device: queue ops::copy_upload_to_device on a lane", allow-invalid = true },
    { path = "euhedral_inference_cuda::ops::copy_device_to_host", reason = "a synchronous copy waits for the device: queue ops::copy_device_to_readback on a lane", allow-invalid = true },
    { path = "euhedral_inference_cuda::sys::EuhedralCuda::euhedral_cuda_synchronize", reason = "nothing waits on the device: poll the lane's completion word (startup, shutdown and tests only)", allow-invalid = true },
    { path = "euhedral_inference_cuda::sys::EuhedralCuda::euhedral_cuda_stream_synchronize", reason = "nothing waits on a stream: poll the lane's completion word (startup, shutdown and tests only)", allow-invalid = true },
    { path = "euhedral_inference_cuda::sys::EuhedralCuda::euhedral_cuda_copy_host_to_device", reason = "a synchronous copy waits for the device: queue euhedral_cuda_copy_upload_to_device on a lane", allow-invalid = true },
    { path = "euhedral_inference_cuda::sys::EuhedralCuda::euhedral_cuda_copy_device_to_host", reason = "a synchronous copy waits for the device: queue euhedral_cuda_copy_device_to_readback on a lane", allow-invalid = true },
    { path = "euhedral_inference_cuda::sys::EuhedralCuda::euhedral_cuda_free", reason = "cudaFree waits for the device: free at shutdown, or use euhedral_cuda_free_async on a lane", allow-invalid = true },
    { path = "euhedral_inference_cuda::sys::EuhedralCuda::euhedral_cuda_host_free", reason = "freeing pinned memory waits for the device: free at shutdown", allow-invalid = true },
    { path = "euhedral_inference_cuda::sys::EuhedralCuda::euhedral_cuda_host_weights_free", reason = "freeing pinned memory waits for the device: free at shutdown", allow-invalid = true },
    # RustEE's blocking helpers (allow-invalid: the crates are linked only where they are used).
    { path = "euhedral_core::utils::spin_wait::await_while", reason = "nothing waits or spins: continue on the completion", allow-invalid = true },
    { path = "euhedral_core::config::CloneLivenessRegistry::await_termination", reason = "nothing waits: shutdown belongs to the lattice's owner", allow-invalid = true },
    { path = "euhedral_hardware_utils::affinity::PinnedThreadExecutor::await_termination", reason = "nothing waits: shutdown belongs to the lattice's owner", allow-invalid = true },
    { path = "std::env::var", reason = "configuration is read in one place, the settings crate; binaries read the environment in main" },
    { path = "std::env::var_os", reason = "configuration is read in one place, the settings crate; binaries read the environment in main" },
    { path = "std::env::vars", reason = "configuration is read in one place, the settings crate; binaries read the environment in main" },
    { path = "std::env::vars_os", reason = "configuration is read in one place, the settings crate; binaries read the environment in main" },
]
disallowed-types = [
    { path = "std::sync::mpsc::Sender", reason = "no channels" },
    { path = "std::sync::mpsc::SyncSender", reason = "no channels" },
    { path = "std::sync::mpsc::Receiver", reason = "no channels" },
    { path = "std::sync::Mutex", reason = "no locks: state is owned by a sink or a source and polled one frame at a time" },
    { path = "std::sync::RwLock", reason = "no locks: state is owned by a sink or a source and polled one frame at a time" },
    { path = "std::sync::Condvar", reason = "nothing waits" },
    { path = "std::sync::Barrier", reason = "nothing waits" },
    { path = "std::net::TcpStream", reason = "sockets go through AsyncIo (raw fds)" },
]

# `std::path::Path::new(..)` written out in code is a fully qualified name: import the type (the absolute_paths lint).
# Two segments (`io::Error`) pass; a path from a crate root with more does not. `use` items are not checked.
absolute-paths-max-segments = 2

# Tests may unwrap, expect and print; library code may not (the unwrap_used, expect_used, print_stdout and
# print_stderr lints).
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-print-in-tests = true
