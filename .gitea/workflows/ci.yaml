# CI for Linux, once per pull request: when the label `land` is added to it (the land step of the orchestrate scripts, `pr-land`:
# merge the target into the branch, add the label, wait for this run on that exact head, merge if green). A push to a pull
# request starts nothing. Any other label event, a label removal included (Gitea maps both to `labeled`), does start a run, with
# every job skipped (the `if:` of each job) except `land-guard`, which fails there; a skipped job counts as passing for a required
# check, so `land-guard` (required) is what keeps such a run from showing the pull request green. Gitea's `pull_request`
# payload carries no `label` object: the label added is in `github.event.changes.added_labels` (an array). The concurrency
# group tells a land run from another label's run, so a label added during a land run cannot cancel it. No path filter: the
# jobs are required checks, and a filtered pull request would never post its context; the job `changes` decides which groups
# run, and the required jobs still report (a group that did not change is skipped, which passes).
# The land run tests the head that is merged: the target is already in it, so the merge commit has the head's tree.
# A push to an integration branch (rust/next*) therefore runs no tests; it runs `landed`, which checks that the pushed commit is
# the merge of a pull request head that had a green land run and has that head's tree. A commit already on main passes only
# when its tree is a tested one (it or a parent with its tree had a green push run: the promoted integration head). A merge
# commit that `rollover promote` made on main because main had commits the integration branch lacked has a tree no run saw, so
# `landed` fails there until a pull request is landed; that land run runs every group because main's head is untested (the
# `changes` step asks `ci-landed.py --tested-tree`), so it tests the tree. The push run is what `rollover promote` needs
# (require_run = ["ci.yaml"] in .gitea/rollover.toml: the latest run with event push, on the integration branch, for
# the promoted commit, must be a success; a dispatched run does not count). A push to main starts nothing: promotion
# moves main to the integration head that already passed, or to a merge commit that `landed` refuses until a land run tests it.
# ARM and the Intel SDE step stay on GitHub, which runs them for the main pushes that forge-mirror sends; the Windows build
# of a land run runs there too, dispatched by the `windows` job below.
# By hand (workflow_dispatch) every group runs.
# Sentinels for `pr-land --require-success`: `changes` and `land-guard`. The rules of the triggers are pinned by
# scripts/lint-ci-triggers.py.
#
# It fails fast: the first job that fails cancels the whole run (the last step of each job, `.gitea/actions/fail-fast`;
# the two Bazel jobs are reusable workflows with no steps of ours, so `gate-failed` and `windows-failed` do it for them).
# A cancelled run is never green: the checks to require are `changes`, `land-guard`, `rust`, `native-package`, `device`,
# `gate-ok` and `windows`, and the others are cancelled with it.
#
# The runner labels are listed below with the jobs that use them.
# A push to an integration branch that is not vars.INTEGRATION_BRANCH fails at once.
#
# Job labels are the runner's (arbiter-docker for the cheap job, arbiter-docker-unconfined for the heavy ones, which need
# seccomp off, arbiter-gpu for the device test jobs, which get the card; the device build runs unconfined without it). No docker job sets timeout-minutes: the arbiter's hold limit (ARBITER_EST + 60 s from the grant) is its limit.
# No job asks for more than --mem 32G, and none uses a cpu form (scripts/lint-workflows.py checks both).
#
# The artifact actions (v4) work against Gitea's artifact store and need Node in the image.
name: ci

on:
  pull_request:
    types: [labeled]
  push:
    branches: ["rust/next*"]
  workflow_dispatch:

# `actions: write` is for the cancel call of the fail-fast step, and nothing else.
permissions:
  contents: read
  actions: write

# The event is part of the group, so a manual run on the integration branch never cancels the push run that
# `rollover promote` requires for that commit, and a push run is per commit. A pull request's land run (true at the end) and
# another label's run (false) are in different groups. Gitea stores this whole block in a varchar(255): a longer one fails the
# insert of the run, and no run starts (scripts/lint-ci-triggers.py keeps it under 200).
concurrency:
  group: ${{ github.event_name }}-${{ github.event.pull_request.number || github.sha }}-${{ contains(github.event.changes.added_labels.*.name, 'land') }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  changes:
    name: changes
    runs-on: arbiter-docker
    if: (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land'))
    env:
      ARBITER_ARGS: "--mem 1G"
      ARBITER_EST: "60"
    outputs:
      rust: ${{ steps.diff.outputs.rust }}
      native: ${{ steps.diff.outputs.native }}
      bazel: ${{ steps.diff.outputs.bazel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test the workflow lint
        run: python3 -m unittest scripts/test_lint_workflows.py
      - name: Lint the memory asked by the workflows
        run: python3 scripts/lint-workflows.py .gitea/workflows
      - name: Test the trigger lint and the landed check
        run: python3 -m unittest scripts/test_lint_ci_triggers.py scripts/test_ci_landed.py
      - name: Lint the triggers
        run: python3 scripts/lint-ci-triggers.py .gitea/workflows/ci.yaml
      - name: Decide which groups changed
        id: diff
        env:
          EVENT: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INTEGRATION_BRANCH: ${{ vars.INTEGRATION_BRANCH }}
          GITEA_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          # The path groups of each job. mise.toml and rust/** are in every group.
          rust_paths=(
            ':(glob)rust/**' ':(glob)native/include/**' ':(glob)mise.toml' ':(glob).gitea/workflows/ci.yaml'
          )
          native_paths=(
            ':(glob)native/**' ':(glob)mise.toml' ':(glob)rust/**' ':(glob).gitea/workflows/ci.yaml'
          )

          # The Bazel gate: the workspace, the Bazel files, and the GitHub workflow the Windows leg runs.
          bazel_paths=(
            ':(glob)rust/**' ':(glob)MODULE.bazel' ':(glob)MODULE.bazel.lock' ':(glob).bazelrc' ':(glob).bazelversion'
            ':(glob).bazelignore' ':(glob)BUILD.bazel' ':(glob)bazel/**' ':(glob).gitattributes' ':(glob)mise.toml'
            ':(glob).gitea/workflows/ci.yaml' ':(glob).github/workflows/ci.yml'
          )

          # Guard: an integration branch other than the current one runs nothing heavy.
          if [ "$EVENT" = push ]; then
            case "$REF_NAME" in
              rust/next*)
                if [ -z "$INTEGRATION_BRANCH" ]; then
                  echo "::error::INTEGRATION_BRANCH is empty, so $REF_NAME is not the integration branch (rollover promote sets it)"
                  exit 1
                fi
                if [ "$INTEGRATION_BRANCH" != "$REF_NAME" ]; then
                  echo "::error::$REF_NAME is not the integration branch ($INTEGRATION_BRANCH is; rollover promote sets it)"
                  exit 1
                fi
                ;;
            esac
          fi

          # Base: what the groups are compared with.
          #   pull request  the merge base with main, whatever the target: a commit that reached the integration branch
          #                 untested cannot be hidden by a later pull request that touches no group
          #   push          nothing: an integration branch push runs no tests, `landed` checks it
          #   dispatch      everything
          all=false
          range=
          case "$EVENT" in
            pull_request)
              range="origin/main...HEAD"
              # A main head no run tested (a merge made on main by a promotion) would hide behind an empty diff: run every
              # group. An answer that cannot be had (exit 2) runs every group too.
              tested=0
              python3 scripts/ci-landed.py --tested-tree "$(git rev-parse origin/main)" || tested=$?
              if [ "$tested" -ne 0 ]; then all=true; fi
              ;;
            push)
              ;;
            *)
              all=true
              ;;
          esac

          # git diff --quiet: 0 means no difference, 1 a difference; anything else is an error and fails the job.
          changed() {
            local rc=0
            if [ "$all" = true ]; then echo true; return; fi
            if [ -z "$range" ]; then echo false; return; fi
            git diff --quiet "$range" -- "$@" || rc=$?
            case "$rc" in
              0) echo false ;;
              1) echo true ;;
              *) echo "::error::git diff $range failed ($rc)" >&2; return 1 ;;
            esac
          }
          rust=$(changed "${rust_paths[@]}")
          native=$(changed "${native_paths[@]}")
          bazel=$(changed "${bazel_paths[@]}")
          echo "event=$EVENT ref=$REF_NAME all=$all range=${range:-none} rust=$rust native=$native bazel=$bazel"
          echo "rust=$rust" >> "$GITHUB_OUTPUT"
          echo "native=$native" >> "$GITHUB_OUTPUT"
          echo "bazel=$bazel" >> "$GITHUB_OUTPUT"
      # Last step: the first failed job cancels the run (see the action).
      - name: Cancel the run
        if: failure()
        uses: ./.gitea/actions/fail-fast

  # A push to an integration branch: the commit must be the merge of a pull request head that had a green land run, with
  # that head's tree, or a commit on main whose tree is a tested one. This is the push run that `rollover promote` requires.
  landed:
    name: landed
    needs: changes
    if: github.event_name == 'push'
    runs-on: arbiter-docker
    env:
      ARBITER_ARGS: "--mem 1G"
      ARBITER_EST: "60"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: The commit is a landed pull request
        env:
          GITEA_TOKEN: ${{ github.token }}
          API_URL: ${{ github.api_url }}
          REPOSITORY: ${{ github.repository }}
        run: python3 scripts/ci-landed.py "$GITHUB_SHA"
      # Last step: the first failed job cancels the run (see the action).
      - name: Cancel the run
        if: failure()
        uses: ./.gitea/actions/fail-fast

  rust:
    name: rust
    needs: changes
    if: (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land')) && needs.changes.outputs.rust == 'true'
    runs-on: arbiter-docker-unconfined
    env:
      ARBITER_ARGS: "--mem 12G"
      ARBITER_EST: "1800"
      # local/ci-base trusts only its own build directory.
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - name: Install the Rust toolchain
        run: mise install rust >/dev/null
      - name: Install bindgen
        # bindgen loads libclang, which local/ci-base carries.
        run: |
          eval "$(mise env -s bash)"
          cargo install bindgen-cli --version 0.72.1 --locked
      - name: Check the CUDA bindings are current
        working-directory: rust
        run: |
          eval "$(mise env -s bash)"
          cargo xtask bindings --check
      - name: Layers
        working-directory: rust
        run: |
          eval "$(mise env -s bash)"
          scripts/check-layers.sh --self-test
      - name: Check formatting
        working-directory: rust
        run: |
          eval "$(mise env -s bash)"
          cargo fmt --all --check
      - name: Lint
        working-directory: rust
        run: |
          eval "$(mise env -s bash)"
          cargo clippy --workspace --all-targets -- -D warnings
      # A build of the server alone, which does not turn on the engine's test-only features that the workspace build does.
      - name: Check the server crates alone
        working-directory: rust
        run: |
          eval "$(mise env -s bash)"
          cargo check -p euhedral-inference-server -p euhedral-inference-api-server -p euhedral-inference-bench
      - name: Check the aarch64 kernels
        working-directory: rust
        run: |
          eval "$(mise env -s bash)"
          rustup target add aarch64-unknown-linux-gnu
          cargo check --target aarch64-unknown-linux-gnu -p euhedral-inference-host-gemv
      - name: Test
        working-directory: rust
        run: |
          eval "$(mise env -s bash)"
          cargo test --workspace
      # Last step: the first failed job cancels the run (see the action).
      - name: Cancel the run
        if: failure()
        uses: ./.gitea/actions/fail-fast

  # The ignored device tests of the workspace, on the card, in groups that each ask the arbiter for what their own tests need.
  # `device-build` builds the native library and the test binaries once, without the card, and uploads them as one artifact.
  # Each `device-*` job downloads it and runs one group of `scripts/ci-device.py`, with no build: a failing group is red
  # when it ends and the others still run. The binaries carry the paths of the build, so the build and the test jobs run
  # in the same workspace path (the script refuses otherwise). `device` is the one check to require: it fails unless every
  # group passed, a skipped group included. Every location comes from the Actions variables below; the jobs write none.
  # EUHEDRAL_NVRTC_DIR (the directory holding libnvrtc) is required. The optional ones are passed to the tests only when set,
  # and a test whose data is missing prints a skip line and passes (each group lists them at its end):
  #   EUHEDRAL_TEST_QWEN_RCO_ARTIFACT              the model artifact
  #   EUHEDRAL_TEST_QUANTIZATION_CUDA_LIBRARIES    the directory with the CUDA math libraries
  # The card holds one engine of the model at a time per process; the arbiter runs groups side by side when their asks fit.
  device-build:
    name: device-build
    needs: changes
    if: (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land')) && needs.changes.outputs.native == 'true'
    runs-on: arbiter-docker-unconfined
    env:
      ARBITER_ARGS: "--mem 16G"
      ARBITER_EST: "900"
      APT_OPTS: "-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/native/.zig-global-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          # shellcheck disable=SC2086 # APT_OPTS is a list of options
          apt-get $APT_OPTS update -qq && apt-get $APT_OPTS install -y -qq llvm xz-utils curl ca-certificates python3-pip gcc libc6-dev >/dev/null
      - name: Install the toolchains
        run: mise install >/dev/null
      - name: Build the native library
        working-directory: rust
        run: mise exec -- cargo xtask native --product linux-x64
      # The device profile is the release profile with debug assertions and overflow checks on: the tests run at the speed
      # of the product and still trip on what the debug build would. The quantization crate's other device tests fail,
      # not skip, without their settings: only its kernel tests are built for the groups.
      - name: Build the device tests
        working-directory: rust
        run: |
          set -euo pipefail
          mise exec -- cargo test --profile device --workspace --exclude euhedral-inference-quantization --no-run \
            --message-format=json > "$RUNNER_TEMP/build-workspace.json"
          mise exec -- cargo test --profile device -p euhedral-inference-quantization --test kernels_gpu --no-run \
            --message-format=json > "$RUNNER_TEMP/build-quantization.json"
      - name: Pack the test binaries
        run: |
          set -euo pipefail
          # The native library finds the CUDA runtime, the grammar library and the kernel sources beside it: the whole
          # native directory goes along.
          test -f build/native/linux-x64/lib/libeuhedral_cuda.so
          mkdir -p "$RUNNER_TEMP/device-tests"
          python3 scripts/ci-device.py pack "$RUNNER_TEMP/build-workspace.json" "$RUNNER_TEMP/build-quantization.json" \
            --native build/native/linux-x64 --out "$RUNNER_TEMP/device-tests/device-tests.tar"
      - name: Upload the device tests
        uses: actions/upload-artifact@v4
        with:
          name: device-tests
          path: ${{ runner.temp }}/device-tests/*
          if-no-files-found: error
          retention-days: 2
      # Last step: the first failed job cancels the run (see the action).
      - name: Cancel the run
        if: failure()
        uses: ./.gitea/actions/fail-fast

  # The CUDA crate kernels and the quantization kernels.
  device-kernels:
    name: device-kernels
    needs: [changes, device-build]
    if: (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land')) && needs.changes.outputs.native == 'true'
    runs-on: arbiter-gpu
    env:
      # The engine sizes its host memory from the container headroom, so a learned cap starves it: limit to the full ask.
      # Measured: 0.5 GB on the card, 0.5 GB of host memory, 114 s.
      ARBITER_ARGS: "--gpu shared:1.5 --mem 2G --no-learned-cap"
      ARBITER_EST: "240"
    steps:
      - uses: actions/checkout@v4
      - name: Download the device tests
        uses: actions/download-artifact@v4
        with:
          name: device-tests
          path: ${{ runner.temp }}/device-tests
      # What an engine start reads to size its host budget: the memory limits of this job's cgroup and its parents.
      - name: Memory limits
        run: |
          grep -E "^(MemTotal|MemAvailable)" /proc/meminfo || true
          group="/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)"
          while [ "${#group}" -ge 14 ]; do
            echo "== $group"
            for file in memory.max memory.current; do
              echo "$file: $(cat "$group/$file" 2>&1)"
            done
            grep -E "^(anon|file|active_file|inactive_file|file_dirty|file_writeback|shmem) " "$group/memory.stat" 2>&1 || true
            group="${group%/*}"
          done
      # Stops at the first failing binary. A test without a model artifact skips with a line starting "skipped:".
      - name: Device tests, kernels
        env:
          EUHEDRAL_NVRTC_DIR: ${{ vars.EUHEDRAL_NVRTC_DIR }}
          EUHEDRAL_TEST_QWEN_RCO_ARTIFACT: ${{ vars.EUHEDRAL_TEST_QWEN_RCO_ARTIFACT }}
          EUHEDRAL_TEST_QUANTIZATION_CUDA_LIBRARIES: ${{ vars.EUHEDRAL_TEST_QUANTIZATION_CUDA_LIBRARIES }}
        run: |
          set -euo pipefail
          python3 scripts/ci-device.py run kernels --archive "$RUNNER_TEMP/device-tests/device-tests.tar" 2>&1 | tee "$RUNNER_TEMP/device.log"
      - name: Skipped tests
        if: always()
        run: grep -h "skipped:" "$RUNNER_TEMP/device.log" | sort | uniq -c || true
      # Last step: the first failed job cancels the run (see the action).
      - name: Cancel the run
        if: failure()
        uses: ./.gitea/actions/fail-fast

  # The server, API server, benchmark and tokenizer tests: each starts its own engine.
  device-servers:
    name: device-servers
    needs: [changes, device-build]
    if: (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land')) && needs.changes.outputs.native == 'true'
    runs-on: arbiter-gpu
    env:
      # Measured: 12.7 GB on the card (one engine at a time), 5.4 GB of host memory; 185 s alone on the card, and past
      # 280 s when other jobs share it, so the estimate leaves room for a shared card.
      ARBITER_ARGS: "--gpu shared:13.5 --mem 8G --no-learned-cap"
      ARBITER_EST: "480"
    steps:
      - uses: actions/checkout@v4
      - name: Download the device tests
        uses: actions/download-artifact@v4
        with:
          name: device-tests
          path: ${{ runner.temp }}/device-tests
      # What an engine start reads to size its host budget: the memory limits of this job's cgroup and its parents.
      - name: Memory limits
        run: |
          grep -E "^(MemTotal|MemAvailable)" /proc/meminfo || true
          group="/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)"
          while [ "${#group}" -ge 14 ]; do
            echo "== $group"
            for file in memory.max memory.current; do
              echo "$file: $(cat "$group/$file" 2>&1)"
            done
            grep -E "^(anon|file|active_file|inactive_file|file_dirty|file_writeback|shmem) " "$group/memory.stat" 2>&1 || true
            group="${group%/*}"
          done
      # Stops at the first failing binary. A test without a model artifact skips with a line starting "skipped:".
      - name: Device tests, servers and benchmarks
        env:
          EUHEDRAL_NVRTC_DIR: ${{ vars.EUHEDRAL_NVRTC_DIR }}
          EUHEDRAL_TEST_QWEN_RCO_ARTIFACT: ${{ vars.EUHEDRAL_TEST_QWEN_RCO_ARTIFACT }}
          EUHEDRAL_TEST_QUANTIZATION_CUDA_LIBRARIES: ${{ vars.EUHEDRAL_TEST_QUANTIZATION_CUDA_LIBRARIES }}
        run: |
          set -euo pipefail
          python3 scripts/ci-device.py run servers --archive "$RUNNER_TEMP/device-tests/device-tests.tar" 2>&1 | tee "$RUNNER_TEMP/device.log"
      - name: Skipped tests
        if: always()
        run: grep -h "skipped:" "$RUNNER_TEMP/device.log" | sort | uniq -c || true
      # Last step: the first failed job cancels the run (see the action).
      - name: Cancel the run
        if: failure()
        uses: ./.gitea/actions/fail-fast

  # The engine binary, the tests that run on a reduced model: no engine of the model.
  device-engine-rig:
    name: device-engine-rig
    needs: [changes, device-build]
    if: (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land')) && needs.changes.outputs.native == 'true'
    runs-on: arbiter-gpu
    env:
      # Measured: 5.4 GB on the card (a reduced model), 12.2 GB of host memory, 140 s.
      ARBITER_ARGS: "--gpu shared:6 --mem 14G --no-learned-cap"
      ARBITER_EST: "300"
    steps:
      - uses: actions/checkout@v4
      - name: Download the device tests
        uses: actions/download-artifact@v4
        with:
          name: device-tests
          path: ${{ runner.temp }}/device-tests
      # What an engine start reads to size its host budget: the memory limits of this job's cgroup and its parents.
      - name: Memory limits
        run: |
          grep -E "^(MemTotal|MemAvailable)" /proc/meminfo || true
          group="/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)"
          while [ "${#group}" -ge 14 ]; do
            echo "== $group"
            for file in memory.max memory.current; do
              echo "$file: $(cat "$group/$file" 2>&1)"
            done
            grep -E "^(anon|file|active_file|inactive_file|file_dirty|file_writeback|shmem) " "$group/memory.stat" 2>&1 || true
            group="${group%/*}"
          done
      # Stops at the first failing binary. A test without a model artifact skips with a line starting "skipped:".
      - name: Device tests, engine, reduced model
        env:
          EUHEDRAL_NVRTC_DIR: ${{ vars.EUHEDRAL_NVRTC_DIR }}
          EUHEDRAL_TEST_QWEN_RCO_ARTIFACT: ${{ vars.EUHEDRAL_TEST_QWEN_RCO_ARTIFACT }}
          EUHEDRAL_TEST_QUANTIZATION_CUDA_LIBRARIES: ${{ vars.EUHEDRAL_TEST_QUANTIZATION_CUDA_LIBRARIES }}
        run: |
          set -euo pipefail
          python3 scripts/ci-device.py run engine-rig --archive "$RUNNER_TEMP/device-tests/device-tests.tar" 2>&1 | tee "$RUNNER_TEMP/device.log"
      - name: Skipped tests
        if: always()
        run: grep -h "skipped:" "$RUNNER_TEMP/device.log" | sort | uniq -c || true
      # Last step: the first failed job cancels the run (see the action).
      - name: Cancel the run
        if: failure()
        uses: ./.gitea/actions/fail-fast

  # The engine binary, the modules whose engines have a short context.
  device-engine-small:
    name: device-engine-small
    needs: [changes, device-build]
    if: (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land')) && needs.changes.outputs.native == 'true'
    runs-on: arbiter-gpu
    env:
      # Measured: 13.1 GB on the card (a 512 and an 8192 token engine), 2.6 GB of host memory, 57 to 141 s.
      ARBITER_ARGS: "--gpu shared:14 --mem 6G --no-learned-cap"
      ARBITER_EST: "300"
    steps:
      - uses: actions/checkout@v4
      - name: Download the device tests
        uses: actions/download-artifact@v4
        with:
          name: device-tests
          path: ${{ runner.temp }}/device-tests
      # What an engine start reads to size its host budget: the memory limits of this job's cgroup and its parents.
      - name: Memory limits
        run: |
          grep -E "^(MemTotal|MemAvailable)" /proc/meminfo || true
          group="/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)"
          while [ "${#group}" -ge 14 ]; do
            echo "== $group"
            for file in memory.max memory.current; do
              echo "$file: $(cat "$group/$file" 2>&1)"
            done
            grep -E "^(anon|file|active_file|inactive_file|file_dirty|file_writeback|shmem) " "$group/memory.stat" 2>&1 || true
            group="${group%/*}"
          done
      # Stops at the first failing binary. A test without a model artifact skips with a line starting "skipped:".
      - name: Device tests, engine, short context
        env:
          EUHEDRAL_NVRTC_DIR: ${{ vars.EUHEDRAL_NVRTC_DIR }}
          EUHEDRAL_TEST_QWEN_RCO_ARTIFACT: ${{ vars.EUHEDRAL_TEST_QWEN_RCO_ARTIFACT }}
          EUHEDRAL_TEST_QUANTIZATION_CUDA_LIBRARIES: ${{ vars.EUHEDRAL_TEST_QUANTIZATION_CUDA_LIBRARIES }}
        run: |
          set -euo pipefail
          python3 scripts/ci-device.py run engine-small --archive "$RUNNER_TEMP/device-tests/device-tests.tar" 2>&1 | tee "$RUNNER_TEMP/device.log"
      - name: Skipped tests
        if: always()
        run: grep -h "skipped:" "$RUNNER_TEMP/device.log" | sort | uniq -c || true
      # Last step: the first failed job cancels the run (see the action).
      - name: Cancel the run
        if: failure()
        uses: ./.gitea/actions/fail-fast

  # The engine binary, the modules that start the 4096-token engine and the loader.
  device-engine-big:
    name: device-engine-big
    needs: [changes, device-build]
    if: (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land')) && needs.changes.outputs.native == 'true'
    runs-on: arbiter-gpu
    env:
      # Measured: 22.1 GB on the card, 23.4 GB of host memory, 53 model loads, 582 s; the disk-tier and forced-row
      # tests added since take it to about 700 s, so the hold leaves room above that.
      ARBITER_ARGS: "--gpu shared:22.5 --mem 28G --no-learned-cap"
      ARBITER_EST: "1000"
    steps:
      - uses: actions/checkout@v4
      - name: Download the device tests
        uses: actions/download-artifact@v4
        with:
          name: device-tests
          path: ${{ runner.temp }}/device-tests
      # What an engine start reads to size its host budget: the memory limits of this job's cgroup and its parents.
      - name: Memory limits
        run: |
          grep -E "^(MemTotal|MemAvailable)" /proc/meminfo || true
          group="/sys/fs/cgroup$(sed -n 's/^0:://p' /proc/self/cgroup)"
          while [ "${#group}" -ge 14 ]; do
            echo "== $group"
            for file in memory.max memory.current; do
              echo "$file: $(cat "$group/$file" 2>&1)"
            done
            grep -E "^(anon|file|active_file|inactive_file|file_dirty|file_writeback|shmem) " "$group/memory.stat" 2>&1 || true
            group="${group%/*}"
          done
      # Stops at the first failing binary. A test without a model artifact skips with a line starting "skipped:".
      - name: Device tests, engine, long context
        env:
          EUHEDRAL_NVRTC_DIR: ${{ vars.EUHEDRAL_NVRTC_DIR }}
          EUHEDRAL_TEST_QWEN_RCO_ARTIFACT: ${{ vars.EUHEDRAL_TEST_QWEN_RCO_ARTIFACT }}
          EUHEDRAL_TEST_QUANTIZATION_CUDA_LIBRARIES: ${{ vars.EUHEDRAL_TEST_QUANTIZATION_CUDA_LIBRARIES }}
        run: |
          set -euo pipefail
          python3 scripts/ci-device.py run engine-big --archive "$RUNNER_TEMP/device-tests/device-tests.tar" 2>&1 | tee "$RUNNER_TEMP/device.log"
      - name: Skipped tests
        if: always()
        run: grep -h "skipped:" "$RUNNER_TEMP/device.log" | sort | uniq -c || true
      # Last step: the first failed job cancels the run (see the action).
      - name: Cancel the run
        if: failure()
        uses: ./.gitea/actions/fail-fast

  # The one check to require: the groups above all passed. A group that did not run (an earlier job failed, or it was
  # cancelled) is a failure here, not a pass; only a run that touched no native path skips everything.
  device:
    name: device
    needs: [changes, device-build, device-kernels, device-servers, device-engine-rig, device-engine-small, device-engine-big]
    if: always() && (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land'))
    runs-on: arbiter-docker
    steps:
      - name: Every device group passed
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        env:
          PATH: /usr/bin:/bin
          CHANGES: ${{ needs.changes.result }}
          NATIVE: ${{ needs.changes.outputs.native }}
          RESULTS: >-
            ${{ needs.device-build.result }} ${{ needs.device-kernels.result }} ${{ needs.device-servers.result }}
            ${{ needs.device-engine-rig.result }} ${{ needs.device-engine-small.result }} ${{ needs.device-engine-big.result }}
        run: |
          test "$CHANGES" = success
          if test "$NATIVE" != true; then
            exit 0
          fi
          for result in $RESULTS; do
            test "$result" = success || { echo "::error::a device job ended $result"; exit 1; }
          done

  native-package:
    name: native-package
    needs: changes
    if: (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land')) && needs.changes.outputs.native == 'true'
    runs-on: arbiter-docker-unconfined
    env:
      ARBITER_ARGS: "--mem 12G"
      ARBITER_EST: "1800"
      APT_OPTS: "-o Acquire::Retries=5 -o Acquire::http::Timeout=20 -o Acquire::ForceIPv4=true"
      MISE_TRUSTED_CONFIG_PATHS: ${{ github.workspace }}
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/native/.zig-global-cache
    steps:
      - uses: actions/checkout@v4
      - name: Install system packages
        run: |
          # shellcheck disable=SC2086 # APT_OPTS is a list of options
          apt-get $APT_OPTS update -qq && apt-get $APT_OPTS install -y -qq llvm xz-utils python3-pip gcc libc6-dev >/dev/null
      - name: Install the toolchains
        run: mise install >/dev/null
      # Both CUDA products (linux-x64 and windows-x64), then the check of each built tree: the kernel sources, the binary
      # format and imports, the bundled runtime and headers, and files.sha256.
      - name: Build and verify both CUDA products
        working-directory: rust
        run: |
          mise exec -- cargo xtask native
          mise exec -- cargo xtask native-verify
      # Host-only native tests (no card): the programmatic-launch wait rule over the kernel sources.
      - name: Native host tests
        working-directory: native/tests
        run: python3 -m unittest test_pdl_wait
      # The Rust server bundle for linux-x64, from the native product just built.
      - name: Bundle the Rust server (linux-x64)
        working-directory: rust
        run: mise exec -- cargo xtask bundle --product linux-x64
      # The Windows server bundle, cross-built here with zig as the linker (the Windows host the pull-request dispatch reaches
      # runs only the Bazel test). The check refuses a native product that lacks its runtime DLLs or imports the wrong
      # library, and the bundle refuses a missing or empty input, so a bad package fails the job.
      - name: Bundle the Rust server (windows-x64)
        working-directory: rust
        run: |
          mise exec -- cargo xtask native-verify --product windows-x64
          mise exec -- cargo xtask bundle --product windows-x64
      - name: Upload the server bundle
        uses: actions/upload-artifact@v4
        with:
          name: rust-server-linux-x64
          path: build/bundle/euhedral-server-linux-x64.tar.gz
          if-no-files-found: error
          retention-days: 2
      - name: Upload the Windows server bundle
        uses: actions/upload-artifact@v4
        with:
          name: rust-server-windows-x64
          path: build/bundle/euhedral-server-windows-x64.zip
          if-no-files-found: error
          retention-days: 2
      # Last step: the first failed job cancels the run (see the action).
      - name: Cancel the run
        if: failure()
        uses: ./.gitea/actions/fail-fast

  # The Bazel gate of the Rust workspace, beside the Cargo jobs: `bazel test //... --config=ci` on Linux, the BUILD files'
  # staleness check, and forge's repo check. The reusable workflows are pinned by the protected tag, by its full ref.
  gate:
    needs: changes
    if: (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land')) && needs.changes.outputs.bazel == 'true'
    uses: euhedral/ci/.gitea/workflows/bazel-gate.yml@refs/tags/v10
    with:
      stale-build: gazelle
      bazel-mem: 16
      bazel-est: 1200
    secrets:
      # Also read by the repo check's pin alignment (C5).
      forge-read-token: ${{ secrets.FORGE_READ_TOKEN }}

  # The same test on the Windows platform: GitHub runs it, dispatched by the proxy, for a pull request only.
  windows:
    needs: changes
    if: (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land')) && needs.changes.outputs.bazel == 'true'
    uses: euhedral/ci/.gitea/workflows/bazel-windows.yml@refs/tags/v10
    with:
      repo: Euhedral-Engine/Euhedral
      permissions: contents:write,actions:write,workflows:write
    secrets:
      GH_APP_ID: ${{ secrets.GH_APP_ID }}
      GH_APP_INSTALLATION_ID: ${{ secrets.GH_APP_INSTALLATION_ID }}
      GH_APP_PRIVATE_KEY_B64: ${{ secrets.GH_APP_PRIVATE_KEY_B64 }}

  # A reusable-workflow job has no step of ours to end with, so these two cancel the run when the job they follow fails.
  gate-failed:
    name: gate-failed
    needs: gate
    if: always() && (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land')) && needs.gate.result == 'failure'
    runs-on: arbiter-docker
    env:
      ARBITER_ARGS: "--mem 1G"
      ARBITER_EST: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.gitea/actions/fail-fast

  windows-failed:
    name: windows-failed
    needs: windows
    if: always() && (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land')) && needs.windows.result == 'failure'
    runs-on: arbiter-docker
    env:
      ARBITER_ARGS: "--mem 1G"
      ARBITER_EST: "60"
    steps:
      - uses: actions/checkout@v4
      - uses: ./.gitea/actions/fail-fast

  # The one check to require for Bazel: a skipped gate (a caller's `if:`) is a failure here, not a pass, unless no Bazel
  # path changed. The Windows workflow runs only for a pull request, so on a push or a manual run its result is `skipped`,
  # and only then (or when no Bazel path changed) is that accepted.
  gate-ok:
    name: gate-ok
    needs: [changes, gate, windows]
    if: always() && (github.event_name != 'pull_request' || contains(github.event.changes.added_labels.*.name, 'land'))
    runs-on: arbiter-docker
    steps:
      # The image's PATH starts with directories an earlier job can write: a planted `bash` could pass this step.
      - name: The gate ran and passed
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        env:
          PATH: /usr/bin:/bin
          EVENT: ${{ github.event_name }}
          CHANGES: ${{ needs.changes.result }}
          BAZEL: ${{ needs.changes.outputs.bazel }}
          GATE: ${{ needs.gate.result }}
          WINDOWS: ${{ needs.windows.result }}
        run: |
          test "$CHANGES" = success
          if test "$BAZEL" != true; then
            exit 0
          fi
          test "$GATE" = success
          if test "$EVENT" = pull_request; then
            test "$WINDOWS" = success
          else
            test "$WINDOWS" = success -o "$WINDOWS" = skipped
          fi

  # The guard of the land rule. Gitea starts this workflow for every `labeled` event of a pull request, and a label removal counts
  # as one (the removal of `land` after a land included): the jobs above are skipped for it, and a skipped job counts as passing
  # for a required check, so a run for another label would show the pull request green. This job runs on every run and fails
  # unless a pull request run is a land run (the label `land` is among the labels the event added); its context is required, so
  # a run for another label is red here, and a later land run on the same head posts a newer success. `pr-land` requires it, and
  # `changes`, to be `success`.
  land-guard:
    name: land-guard
    runs-on: arbiter-docker
    env:
      ARBITER_ARGS: "--mem 1G"
      ARBITER_EST: "60"
      EVENT: ${{ github.event_name }}
      LAND_ADDED: ${{ contains(github.event.changes.added_labels.*.name, 'land') }}
    steps:
      - name: Fail unless a pull request run is a land run
        shell: /usr/bin/bash --noprofile --norc -eo pipefail {0}
        env:
          PATH: /usr/bin:/bin
        run: |
          [ "$EVENT" != pull_request ] || [ "$LAND_ADDED" = true ] || { echo "not a land run: the label land was not added by this event"; exit 1; }
