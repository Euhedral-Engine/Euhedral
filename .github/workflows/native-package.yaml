name: CUDA native products

on:
  push:
    branches: [main]
    paths:
      - "native/**"
      - "native.gradle.kts"
      - "build.gradle.kts"
      - "api/build.gradle.kts"
      - "mise.toml"
      - ".github/workflows/native-package.yaml"
  pull_request:
    paths:
      - "native/**"
      - "native.gradle.kts"
      - "build.gradle.kts"
      - "api/build.gradle.kts"
      - "mise.toml"
      - ".github/workflows/native-package.yaml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cross-package:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    concurrency:
      group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}-${{ matrix.os }}
      cancel-in-progress: true
    env:
      ZIG_GLOBAL_CACHE_DIR: ${{ github.workspace }}/native/.zig-global-cache
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - uses: gradle/actions/setup-gradle@v4
      - name: Cache Zig
        uses: actions/cache@v4
        with:
          path: |
            native/.zig-cache
            native/.zig-global-cache
          key: ${{ runner.os }}-zig-${{ hashFiles('mise.toml', 'native/build.zig', 'native/native-products.json') }}
          restore-keys: |
            ${{ runner.os }}-zig-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build both CUDA products and package Spring Boot
        run: mise exec -- gradle nativeVerify :api:bootJar build
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: failed-tests-${{ matrix.os }}
          path: |
            api/build/test-results/test/*.xml
            core/build/test-results/test/*.xml
            benchmark/build/test-results/test/*.xml
      - name: Check ELF/PE targets, imports, and installed CUDA sources
        run: python -m unittest discover -s native/tests -v
      - uses: actions/upload-artifact@v4
        with:
          name: cuda-native-${{ matrix.os }}
          if-no-files-found: error
          retention-days: 2
          path: |
            build/distributions/euhedral-cuda-native.zip
            api/build/libs/euhedral-inference-api.jar
