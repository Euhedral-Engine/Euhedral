# OpenAI-compatible clients use http://<server.address>:<server.port>/v1 as their base URL.
server:
  port: ${PORT:1738}
  # Let in-flight completions finish before generation threads and the engine are stopped.
  shutdown: graceful

# Prometheus metrics at /metrics; no other management endpoint is exposed.
management:
  endpoints:
    web:
      base-path: /
      exposure:
        include: prometheus
      path-mapping:
        prometheus: metrics
  metrics:
    tags:
      application: euhedral-inference

spring:
  application:
    name: euhedral-inference-api
  lifecycle:
    timeout-per-shutdown-phase: 30s
  main:
    banner-mode: off

euhedral:
  # Required; each may also be set through EUHEDRAL_INFERENCE_* environment variables.
  inference:
    # artifact-path: /path/to/model.edrl
    # tokenizer-directory: /path/to/checkpoint   (tokenizer.json, chat_template.jinja, generation_config.json)
    # cuda-library-path: /path/to/libeuhedral_cuda.so
    # worker-cpus: 2,3            (optional; processor IDs or inclusive ranges, e.g. 2-5,8; unset: as many cores as the CPU quota allows, all without one)
    # model-id: qwen3.8-27b       (the name clients send as "model")
    # max-context-tokens: 32768   (optional; longest prompt plus completion; longer contexts hold weights in host memory)
    # prefix-cache-bytes: 4294967296   (optional; pinned host memory that keeps earlier prompts' state for reuse; 0 disables)
    # prefix-cache-checkpoint-tokens: 2048   (optional; prompt tokens between stored checkpoints; a multiple of 512)
    # kv-cache: nvfp4   (optional; attention cache format, nvfp4 or bf16; unset: the artifact's)
    # max-sequences: 1   (optional; generations that run at once, each with its own sequence state; 0: as many as fit without holding back more weights than one sequence does)
    shutdown-timeout: 10s
  api:
    default-max-tokens: 4096
    max-queued-generations: 16
    max-request-bytes: 1048576
    request-timeout: 30m
