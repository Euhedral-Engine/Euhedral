[workspace]
members = ["crates/test-support"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.99.1"
publish = false

# The RustEE crates (euhedral-core, euhedral-graph, euhedral-hardware-utils, euhedral-hashing) join
# [workspace.dependencies] as git dependencies pinned by `rev` once CI can fetch the private repository.
[workspace.dependencies]
tempfile = "3.27"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "warn"
