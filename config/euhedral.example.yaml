# Euhedral Inference settings: every key, with its default.
#
# The smallest working file sets the two required keys:
#
#   model:
#     artifact: /models/qwen3_8_27b.edrl
#     name: qwen3.8-27b
#
# The artifact carries its tokenizer and chat template.
#
# Start the server with:  java --enable-native-access=ALL-UNNAMED -jar euhedral-inference.jar --config <this file>
# (or set EUHEDRAL_CONFIG to the file's path).
#
# Any key can be overridden, or supplied when the file lacks it, by an environment variable named EUHEDRAL_ plus the
# key path upper-cased with "." and "-" written as "_": model.artifact is EUHEDRAL_MODEL_ARTIFACT and
# kernels.trellis.target-blocks is EUHEDRAL_KERNELS_TRELLIS_TARGET_BLOCKS. PORT also sets server.port.
# Sizes take units (4GiB, 700MiB; a plain number is bytes); durations take units (10s, 30m, 1000ms; 0 is zero).
# "auto" means the value is chosen at startup from the machine. An unknown key stops the server with the key named.

model:
  artifact: /models/qwen3_8_27b.edrl          # required: the model artifact file
  name: qwen3.8-27b                           # required: the model name clients send as "model"

sampling:                                     # used for the fields a request leaves out
  temperature: 1.0                            # optional, default 1.0: 0 is greedy decoding
  top-k: 20                                   # optional, default 20: the most likely tokens kept; 0 keeps every token
  top-p: 0.95                                 # optional, default 0.95: the probability mass kept, above 0 and at most 1

server:
  port: 1738                                  # optional, default 1738: the port to listen on
  shutdown-timeout: 10s                       # optional, default 10s: how long closing the engine waits for its workers to stop
  requests:
    default-max-tokens: 4096                  # optional, default 4096: tokens generated when a request names no limit
    max-queued: 16                            # optional, default 16: requests waiting for the engine before new ones are refused (0 rejects any request that would wait)
    max-body-size: 1MiB                       # optional, default 1MiB: largest request body
    timeout: 30m                              # optional, default 30m: longest a request may run

context:
  max-tokens: 32768                           # optional, default 32768: longest context of one sequence
  kv-cache-format: auto                       # optional, default auto: nvfp4 | bf16 | auto (the artifact's)
  kv-cache-on-gpu-tokens: 65536               # optional, default 65536: tokens of a sequence kept on the GPU before its cache spills to the host

prefix-cache:
  size: 4GiB                                  # optional, default 4GiB: host memory for shared prompt prefixes; 0 disables
  checkpoint-tokens: 2048                     # optional, default 2048: tokens between stored checkpoints; a positive multiple of 512
  copy-piece-bytes: 16MiB                     # optional, default 16MiB, Rust engine only: most bytes one checkpoint copy moves at a time

batching:
  max-sequences: 1                            # optional, default 1: sequences held at once; 0 holds as many as fit
  max-sequences-per-pass: auto                # optional, default auto: sequences in one shared decode or verification pass (auto = no bound)
  max-tokens-per-pass: auto                   # optional, default auto: rows in one shared pass (auto = prefill-chunk-tokens)
  prefill-chunk-tokens: 512                   # optional, default 512: rows of the longest prefill chunk
  forced-rows: 0                              # optional, default 0, Rust engine only: rows of one step of a teacher-forced run that takes several rows at a time (0 or 1: one row a step)

memory:
  host-limit: auto                            # optional, default auto: host memory the engine may use (0: no RAM tier)
  host-weights-limit: auto                    # optional, default auto: pinned host memory for host-backed weights
  host-margin: auto                           # optional, default auto: host memory kept for the system when the budget is derived from what the machine can spare (auto = the larger of 4GiB and 10% of it; 0 keeps none)
  staging-slots: auto                         # optional, default auto: pinned staging slots for weights that stream through the host (auto = 4)
  disk-window-slots: auto                     # optional, default auto: pinned window slots the artifact is read into for weights that stay on disk (auto = twice staging-slots; must be a whole multiple of staging-slots)
  gpu-limit: auto                             # optional, default auto: device memory the engine may use (auto = what is free)
  gpu-reserve: 700MiB                         # optional, default 700MiB: device memory left for other programs
  runtime-headroom: auto                      # optional, default auto: device memory kept above what the workspace, scratch, first sequence state and MTP cache need, for the kernels the driver loads after the plan is admitted (auto = 320MiB)
  runtime-reserve: auto                       # optional, default auto: device memory the dense model's plan keeps beside the weights and the cache for the first sequence's state, the workspaces and the kernel modules (auto = 1280MiB)
  pinned-buffer-pool: auto                    # optional, default auto: released pinned buffers kept for reuse (auto = the larger of 64MiB and RAM/256)
  weight-streaming:                           # models that stream weights from disk (Qwen3.8-Flash-Next)
    concurrent-reads: 8                       # optional, default 8: artifact records read at once
    read-split: 1                             # optional, default 1: parts one record read is split into
    copy-streams: 4                           # optional, default 4: CUDA streams copying expert weights to the GPU
    gpu-streams: 2                            # optional, default 2: GPU streams a step runs on
  host-layers:                                # layers whose weights stay in host memory
    compute: auto                             # optional, default auto: auto | cpu | stream (cpu reads the weights in place; stream copies them to the GPU)
    gemv-rows: auto                           # optional, default auto: rows of one CPU GEMV chunk (auto = sized from the cache and the row's byte size)
    prefill-slots: auto                       # optional, default auto: staging slots for prefill of host-resident layers

host:
  cpus: auto                                  # optional, default auto: CPUs the workers run on, such as 2-5,8 (auto = all)
  task-parallelism: 8                         # optional, default 8: workers taking host work at once
  idle-release: 1s                            # optional, default 1s: idle time before workers are released; 0 never releases them
  max-batch-size: auto                        # optional, default auto: most frames a lattice worker takes from its cache at once (auto = the runtime's default); 1 or 2 makes workers poll one frame at a time, so other workers can steal what waits behind a heavy frame
  native-cache: auto                          # optional, default auto: where the jar unpacks its native files (auto = the user's cache directory)

kernels:
  rms-norm-decode-slices: auto                # optional, default auto: slices of the output pass of a one-row RMS norm, a decode step (auto = 40 on every card, the value chosen with the sliced kernel; 1 to 65535, the output is the same for any count)
  fused-verify-from: auto                     # optional, default auto: the fewest keys at which the fused verifier kernel serves each of 0 to 8 verified rows, nine comma-separated whole numbers or never (auto = never,never,49152,16384,4096,2048,16384,16384,12288, measured on an RTX 5070 Ti; entries below 2048 have no effect, the fused kernel serves only from 2048 keys)
  trellis:
    tensor-core-max-tokens: 512               # optional, default 512: most rows of a non-verification launch kept on the tensor-core route; at least 8
    target-blocks: auto                       # optional, default auto: thread blocks the K split aims for (auto = 8 per streaming multiprocessor)
    whole-k-min-tokens: 64                    # optional, default 64: fewest rows for blocks that run every K split of their columns themselves
    wide-block-min-tokens: 128                # optional, default 128: fewest rows for blocks of 64 rows instead of 32
  compile:
    stack: 256MiB                             # optional, default 256MiB: stack of the thread that compiles a kernel module at load (applies when the Rust engine loads its kernels through RustEE, which it does not do yet; the Java engine checks the value and ignores it)
  graphs:
    captures-per-view: 0                      # optional, default 0: CUDA graphs a sequence keeps for each of decode, verification and draft, counted together (the cache holds this many times the number of views, and releases the graph used least recently, of any view, when it is full); the default 0 captures nothing and every quantum runs stage by stage, a positive value (8 is a usual choice) turns captures on (read by the Rust engine; the Java engine checks the value and ignores it)
