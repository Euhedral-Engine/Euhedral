[package]
description = "The quantization library: the seeded generators, the .npy and .npz formats and the pieces the quantization commands share."
edition.workspace = true
name = "euhedral-inference-quantization"
publish.workspace = true
rust-version.workspace = true
version = "0.1.0"

[features]
# `test-hooks`: calls on a lane that tests use to reach paths a healthy driver does not take (a failed arming of a
# retirement). Not for production code.
test-hooks = []

[dependencies]
crc32fast.workspace = true
euhedral-core.workspace = true
euhedral-data-structures.workspace = true
euhedral-gpu = { workspace = true, features = ["cuda"] }
euhedral-graph.workspace = true
euhedral-hashing.workspace = true
euhedral-inference-api-protocol = { path = "../api-protocol" }
euhedral-inference-cuda = { path = "../cuda" }
euhedral-inference-edrl = { path = "../edrl" }
euhedral-inference-engine = { path = "../engine" }
euhedral-inference-settings = { path = "../settings" }
euhedral-inference-tokenizer = { path = "../tokenizer" }
euhedral-io.workspace = true
euhedral-memory.workspace = true
same-file.workspace = true
serde_json = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
euhedral-inference-edrl = { path = "../edrl", features = ["test-util"] }
euhedral-inference-quantization = { path = ".", features = ["test-hooks"] }
euhedral-gpu = { workspace = true, features = ["fake"] }
tempfile.workspace = true
test-support = { path = "../test-support" }

[lints]
workspace = true
