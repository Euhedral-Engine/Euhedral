# The release step, played by hand (workflow_dispatch) on the integration branch. `rollover promote` checks everything first
# and changes nothing when a check fails: it needs a successful push run of ci.yaml on the promoted commit, moves main to it,
# starts the next integration branch there (protected, the open pull requests moved to it, INTEGRATION_BRANCH set to it) and
# deletes the old branch on Gitea and, over ssh with the host user's key, on GitHub. It never deploys.
#
# It runs on the host runner, which runs only push and workflow_dispatch on a protected integration branch (the runner's
# host-guard enforces that; the `if` below is a convenience). The token is the promote bot's host file, never an Actions
# secret. No checkout is needed: rollover clones the repository itself and reads .gitea/rollover.toml from the promoted commit.
#
# Inputs (strings):
#   next_branch  optional: the new branch's name (default: the old number plus one)
#   dry_run      "1" (the default) prints the plan and changes nothing; "0" promotes
#
# The rollover release is pinned here: the tag and the sha256 of its linux binary, changed by a reviewed pull request.
name: promote

on:
  workflow_dispatch:
    inputs:
      next_branch:
        description: "Name of the next integration branch (empty: the old number plus one)"
        required: false
        default: ""
      dry_run:
        description: 'Print the plan and change nothing ("1"); "0" promotes'
        required: false
        default: "1"

permissions:
  contents: read

env:
  # The rollover release to run, and the sha256 of its asset rollover-x86_64-unknown-linux-musl.
  ROLLOVER_TAG: v1.0.0
  # PLACEHOLDER until the v1.0.0 release is cut: replace with the digest of that asset (a line of its SHA256SUMS).
  # The step refuses to run while this is not 64 hex digits.
  ROLLOVER_SHA256: "PLACEHOLDER-fill-with-the-sha256-of-rollover-x86_64-unknown-linux-musl-v1.0.0"

concurrency:
  group: euhedral-integration
  cancel-in-progress: false

jobs:
  promote:
    name: promote
    runs-on: arbiter-host
    if: github.ref_name == vars.INTEGRATION_BRANCH
    timeout-minutes: 20
    env:
      CI_JOB_TIMEOUT: "1200" # timeout-minutes x 60; keep the two together
      FORGE_URL: ${{ vars.FORGE_URL }}
    steps:
      - name: Download rollover and check its sha256
        env:
          JOB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$ROLLOVER_SHA256" in
            *[!0-9a-f]* | "") echo "::error::ROLLOVER_SHA256 in promote.yaml is not filled in"; exit 1 ;;
          esac
          [ "${#ROLLOVER_SHA256}" -eq 64 ] || { echo "::error::ROLLOVER_SHA256 in promote.yaml is not 64 hex digits"; exit 1; }
          [ -n "$FORGE_URL" ] || { echo "::error::vars.FORGE_URL is not set"; exit 1; }

          secrets="${FORGE_CI_SECRETS:-$HOME/.config/forge/ci-secrets/euhedral}"
          mkdir -p "$GITHUB_WORKSPACE"
          work=$(mktemp -d -p "$GITHUB_WORKSPACE" rollover.XXXXXX)
          trap 'rm -rf "$work"' EXIT
          umask 077
          url="$FORGE_URL/euhedral/rollover/releases/download/$ROLLOVER_TAG/rollover-x86_64-unknown-linux-musl"
          bin="$work/rollover"

          # A header file keeps the token out of every command line. The job token goes first; if it cannot read the
          # release (or the answer is not the pinned file), the promote bot's token does. The hash decides either way.
          fetch() {
            printf 'Authorization: token %s\n' "$1" > "$work/header"
            rm -f "$bin"
            curl -fsS --max-time 120 --retry 2 -H "@$work/header" -o "$bin" "$url" || return 1
            echo "$ROLLOVER_SHA256  $bin" | sha256sum --check --status
          }
          if fetch "$JOB_TOKEN"; then
            echo "downloaded rollover $ROLLOVER_TAG with the job token"
          elif [ -r "$secrets/promote.token" ] && fetch "$(tr -d '\r\n' < "$secrets/promote.token")"; then
            echo "downloaded rollover $ROLLOVER_TAG with the promote bot's token"
          else
            echo "::error::could not download rollover $ROLLOVER_TAG with a matching sha256"
            exit 1
          fi
          chmod 0755 "$bin"
          mkdir -p "$GITHUB_WORKSPACE/.bin"
          mv "$bin" "$GITHUB_WORKSPACE/.bin/rollover"
      - name: Promote
        env:
          NEXT_BRANCH: ${{ github.event.inputs.next_branch }}
          DRY_RUN: ${{ github.event.inputs.dry_run }}
        run: |
          set -euo pipefail
          secrets="${FORGE_CI_SECRETS:-$HOME/.config/forge/ci-secrets/euhedral}"
          args=(promote --production --token-file "$secrets/promote.token")
          if [ -n "$NEXT_BRANCH" ]; then args+=(--next "$NEXT_BRANCH"); fi
          if [ "${DRY_RUN:-1}" != 0 ]; then args+=(--dry-run); fi
          # Host jobs are not arbiter-gated, so this step asks for its own lease. The repository, the commit, the
          # branch and the API address come from the job's GITHUB_* variables and FORGE_URL.
          system-run --mem 1G --est 300 -- "$GITHUB_WORKSPACE/.bin/rollover" "${args[@]}"
