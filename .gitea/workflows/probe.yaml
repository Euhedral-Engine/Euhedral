name: probe
on: workflow_dispatch
permissions:
  contents: read
  actions: write
jobs:
  sleeper:
    runs-on: arbiter-docker
    env:
      ARBITER_ARGS: "--mem 1G"
      ARBITER_EST: "300"
    steps:
      - run: sleep 240
  canceller:
    runs-on: arbiter-docker
    env:
      ARBITER_ARGS: "--mem 1G"
      ARBITER_EST: "120"
    steps:
      - name: cancel
        env:
          TOKEN: ${{ gitea.token }}
          API: ${{ gitea.api_url }}
          SERVER: ${{ gitea.server_url }}
          REPO: ${{ gitea.repository }}
          RUN_ID: ${{ gitea.run_id }}
          RUN_NUMBER: ${{ gitea.run_number }}
        run: |
          echo "api=$API server=$SERVER repo=$REPO run_id=$RUN_ID number=$RUN_NUMBER"
          which curl || true
          for id in "$RUN_ID" "$RUN_NUMBER"; do
            code=$(curl -s -o body.txt -w '%{http_code}' -X POST -H "Authorization: token $TOKEN" "$API/repos/$REPO/actions/runs/$id/cancel" || true)
            echo "cancel $id -> $code"; head -c 300 body.txt; echo
          done
