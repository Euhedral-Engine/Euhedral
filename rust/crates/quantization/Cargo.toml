[package]
description = "The quantization library: the seeded generators, the .npy and .npz formats and the pieces the quantization commands share."
edition.workspace = true
name = "euhedral-inference-quantization"
publish.workspace = true
rust-version.workspace = true
version = "0.1.0"

[dependencies]
crc32fast.workspace = true
euhedral-core.workspace = true
euhedral-gpu = { workspace = true, features = ["cuda"] }
euhedral-graph.workspace = true
euhedral-hashing.workspace = true
euhedral-inference-cuda = { path = "../cuda" }
euhedral-inference-edrl = { path = "../edrl" }
euhedral-inference-engine = { path = "../engine" }
euhedral-inference-settings = { path = "../settings" }
euhedral-io.workspace = true
serde_json = { workspace = true }
thiserror.workspace = true

[dev-dependencies]
euhedral-data-structures.workspace = true
euhedral-gpu = { workspace = true, features = ["fake"] }
euhedral-graph.workspace = true
tempfile.workspace = true
test-support = { path = "../test-support" }

[lints]
workspace = true
